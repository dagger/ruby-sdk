# This repository as the workspace's ruby SDK, and the scopes it generates.
# The e2e module's checks register and generate the fixture scopes of
# .dagger/modules/e2e/fixtures in their own copy of the workspace.

[modules.ruby-sdk]
source = "."

[modules.e2e]
source = ".dagger/modules/e2e"

[sdks.ruby]
module = "ruby-sdk"

# The SDK module's Ruby half is a plain scope: generation keeps its core
# bindings, dagger.gemfile and lock. The SDK module itself is a Dang module.
[sdks.ruby.scopes."."]

[sdks.ruby.scopes.".dagger/modules/e2e"]
is-module = true
name = "e2e"
clients = ["."]
