# The fixture scopes. hack/e2e.sh appends them to dagger.toml in its copy of the
# tree and generates them there, so the repository keeps their sources only.

[sdks.ruby.scopes.".dagger/modules/e2e/fixtures/app"]
is-module = true
name = "app"

[sdks.ruby.scopes.".dagger/modules/e2e/fixtures/clients/dep"]
is-module = true
name = "dep"

[sdks.ruby.scopes.".dagger/modules/e2e/fixtures/lookup/app"]
is-module = true
name = "lookup-app"

[sdks.ruby.scopes.".dagger/modules/e2e/fixtures/types"]
is-module = true
name = "types"
clients = ["./.dagger/modules/e2e/fixtures/clients/dep"]

[sdks.ruby.scopes.".dagger/modules/e2e/fixtures/plain"]
clients = ["./.dagger/modules/e2e/fixtures/clients/dep"]

[sdks.ruby.scopes.".dagger/modules/e2e/fixtures/config/app"]
is-module = true
name = "config-app"

[sdks.ruby.scopes.".dagger/modules/e2e/fixtures/config/configured"]
is-module = true
name = "config-configured"

[sdks.ruby.scopes.".dagger/modules/e2e/fixtures/config/configured".settings]
rubyVersion = "3.4"

[sdks.ruby.scopes.".dagger/modules/e2e/fixtures/collections/app"]
is-module = true
name = "collections"

[sdks.ruby.scopes.".dagger/modules/e2e/fixtures/collections/caller"]
is-module = true
name = "collections-caller"
clients = ["./.dagger/modules/e2e/fixtures/collections/app"]

[sdks.ruby.scopes.".dagger/modules/e2e/fixtures/include/app"]
is-module = true
name = "include-app"

[sdks.ruby.scopes.".dagger/modules/e2e/fixtures/include/caller"]
is-module = true
name = "include-caller"
clients = ["./.dagger/modules/e2e/fixtures/include/app"]
